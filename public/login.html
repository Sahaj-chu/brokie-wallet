<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brokie Wallet – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background-color: #F0F0F0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0px 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-row img {
      width: 48px;
      height: 48px;
    }

    .logo-row h1 {
      font-size: 26px;
      font-weight: 700;
      color: #222;
    }

    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 32px;
    }

    .tabs {
      display: flex;
      background: #F0F0F0;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: white;
      color: #FF8800;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      background: #F0F0F0;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      transition: border 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border: 1px solid #FF8800;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #FF8800;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(255,136,0,0.35);
      transition: background 0.2s;
    }

    .submit-btn:hover { background: #da671a; }

    .error-msg {
      color: #F60000;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-row">
      <img src="Logo.png" alt="logo">
      <h1>Brokie Wallet</h1>
    </div>
    <p class="subtitle">Track your income & expenses daily</p>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="form-login">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter your username">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter your password">
      </div>
      <button class="submit-btn" onclick="login()">Log In</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Choose a password">
      </div>
      <button class="submit-btn" onclick="register()">Create Account</button>
    </div>

    <p class="error-msg" id="error-msg"></p>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('error-msg').textContent = '';
    }

    async function login() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('loggedIn', 'true');
        window.location.href = '/index.html';
      } else {
        document.getElementById('error-msg').textContent = data.error || 'Login failed';
      }
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('error-msg').style.color = '#21DD00';
        document.getElementById('error-msg').textContent = 'Account created! Please log in.';
        switchTab('login');
      } else {
        document.getElementById('error-msg').textContent = data.error || 'Registration failed';
      }
    }

    // Allow Enter key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const activeForm = document.getElementById('form-login').style.display !== 'none' ? 'login' : 'register';
        activeForm === 'login' ? login() : register();
      }
    });
  </script>
</body>
</html>
